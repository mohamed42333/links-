<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Tamer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Playfair+Display:wght@700&display=swap">
<style>
:root{--bg:#07070a;--card:#18161c;--gold:#d4af37;--gold2:#f6e3a1;--tx:#f5efe0;--mut:#a89f8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0d0a05}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#3a2c0c 0,#120e06 40%,var(--bg) 75%)}
.sp{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sp i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--gold2);opacity:0;animation:up linear infinite;will-change:transform,opacity}
@keyframes up{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.8}100%{transform:translate3d(0,-105vh,0);opacity:0}}
.w{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 18px 30px;text-align:center}
.ph{position:relative;width:164px;height:164px;margin:0 auto 18px}
.ph::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#8a6d1a,var(--gold2),var(--gold),#8a6d1a,var(--gold2),#8a6d1a);animation:spin 8s linear infinite;will-change:transform}
.ph img{position:absolute;inset:5px;width:154px;height:154px;border-radius:50%;object-fit:cover;border:4px solid var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.nm{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
.nm .e{font-size:26px;animation:bob 2.4s ease-in-out infinite;will-change:transform}
.nm .e:last-child{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-5px)}}
h1{margin:0;font:700 31px 'Playfair Display',Georgia,serif;letter-spacing:1px;background:linear-gradient(100deg,#b8901f,#fff1b8 50%,#b8901f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sy{margin:8px 0 4px;font-size:20px;letter-spacing:6px}
.sub{color:var(--mut);margin:0 0 26px;font-size:14px}
.card{background:var(--card);border:1px solid rgba(212,175,55,.35);border-radius:20px;padding:14px;margin-bottom:14px;text-align:right;opacity:0;transform:translateY(20px);animation:in .5s ease-out forwards}
@keyframes in{to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:14px}
.ic{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center}
.ic svg{width:30px;height:30px}
.tt{flex:1}
.tt b{display:block;font-weight:900;font-size:18px}
.tt span{font-size:12px;color:var(--mut)}
.ar{color:var(--gold);font-size:22px}
.bt{display:flex;gap:10px;margin-top:14px}
.b{flex:1;text-align:center;padding:11px 6px;border-radius:14px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font:700 14px Cairo,Tahoma,sans-serif;text-decoration:none;cursor:pointer;transition:transform .12s}
.b:active{transform:scale(.94)}
.b.f{background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#a8821c);color:#1a1405;border:0}
.qp{display:none;text-align:center}
.qp.o{display:block}
.qp canvas{width:210px;height:210px;margin-top:16px;border-radius:14px;background:#fff;border:4px solid var(--gold);image-rendering:pixelated}
.qp .b{display:block;width:100%;margin-top:12px}
.msg{font-size:12px;color:var(--gold2);margin-top:8px;min-height:16px}
footer{margin-top:24px;color:var(--gold);font-size:14px;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>


<style>
/* شاشة التحميل */
#page-loader {
    position: fixed;
    inset: 0;
    background: #101114;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    transition: opacity .6s ease, visibility .6s ease;
}

#page-loader.hide {
    opacity: 0;
    visibility: hidden;
}

/* دائرة التحميل */
.loader-circle {
    width: 55px;
    height: 55px;
    border: 4px solid #333;
    border-top: 4px solid #d4af37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* اسم الموقع */
.loader-title {
    color: #d4af37;
    font-size: 23px;
    font-weight: 900;
    margin-top: 22px;
    letter-spacing: 1px;
    font-family: Arial, sans-serif;
}

/* عبارة التحميل */
.loader-text {
    color: #aaa;
    font-size: 13px;
    margin-top: 10px;
}
</style>

    

</head><body>
